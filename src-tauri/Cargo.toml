[package]
name = "pocket-lens"
version = "0.3.0"
description = "Your Android devices, one simple desktop"
authors = ["Diego Joel Robles Muñoz"]
edition = "2024"
license = "MIT"
repository = "https://github.com/Beldi13/pocket-lens"
default-run = "pocket-lens"

[features]
diagnostics = []

[[bin]]
name = "pocket-lens-check"
path = "src/bin/live-check.rs"
required-features = ["diagnostics"]

[lib]
name = "pocket_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10"
trash = "5"
tauri-plugin-updater = "2"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
