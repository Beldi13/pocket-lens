name: Windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm run vendor:prepare
      - run: npm run verify
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Diagnose native test loader failure
        if: failure()
        run: python scripts/check-windows-imports.py 'src-tauri/target/debug/deps/pocket_lens_lib-*.exe' | Tee-Object -FilePath artifacts/windows-imports.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-test-diagnostics
          path: |
            artifacts/windows-imports.txt
            src-tauri/target/debug/deps/pocket_lens_lib-*.exe
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --features diagnostics --bin pocket-lens-check
      - run: npm run tauri build -- --ci
      - name: Installer checksum
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { "$( (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower() )  $($_.Name)" } | Set-Content -Encoding utf8 src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-lens-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/pocket-lens-check.exe
            artifacts/pocket-lens-third-party-sources.zip
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} src-tauri/target/release/bundle/nsis/* artifacts/pocket-lens-third-party-sources.zip --verify-tag --generate-notes --prerelease
    permissions:
      contents: write
