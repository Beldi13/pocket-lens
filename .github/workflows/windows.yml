name: Windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm run vendor:prepare
      - name: Build read-only Android wallpaper helper
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "platforms;android-35" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK setup failed' }
          ./scripts/build-wallpaper.ps1
      - run: npm run verify
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --features diagnostics --bin pocket-lens-check
      - name: Build verification installer without release secrets
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build -- --ci --config src-tauri/tauri.verify.conf.json
      - name: Build signed release installer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --ci
      - name: Installer checksum
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/* | Where-Object { $_.Name.Contains(' ') } | Rename-Item -NewName { $_.Name.Replace(' ', '.') }
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { "$( (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower() )  $($_.Name)" } | Set-Content -Encoding utf8 src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      - name: Exercise signed installer update in an isolated application
        shell: pwsh
        run: ./scripts/check-update.ps1
      - name: Prepare signed update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/prepare-release.mjs $env:GITHUB_REF_NAME
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-lens-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/pocket-lens-check.exe
            artifacts/pocket-lens-third-party-sources.zip
          if-no-files-found: error
      - name: Stage complete tagged release for physical acceptance
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $releaseArguments = @('release', 'create', $tag, '--verify-tag', '--draft', '--title', "Pocket Lens $tag", '--notes-file', 'docs/releases/0.3.0.md')
          if ($tag.Contains('-')) { $releaseArguments += '--prerelease' }
          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          $releaseAssets = @(Get-ChildItem src-tauri/target/release/bundle/nsis/* -File | ForEach-Object FullName)
          & gh release upload $tag @releaseAssets artifacts/pocket-lens-third-party-sources.zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload every release asset' }
    permissions:
      contents: write
